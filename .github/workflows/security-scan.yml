name: Plugin Security Scan

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read
  security-events: write

jobs:
  scan:
    if: contains(github.event.issue.title, '[Plugin Submission]')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Scan Initialization
        id: ack
        uses: actions/github-script@v7
        with:
          script: |
            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⏳ **Security Scan Initializing...**\n\nSetting up environment and fetching payload..."
            });
            return comment.data.id;

      - name: Pre-flight Metadata Validation
        id: preflight
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commentId = '${{ steps.ack.outputs.result }}';
            
            const fail = async (msg) => {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: parseInt(commentId),
                body: `❌ **Security Scan Rejected**\n\n${msg}\n\n**Workflow Run:** [View Logs](${runUrl})`
              });
              core.setOutput('handled_failure', 'true');
              core.setFailed(msg);
            };

            const titleRegex = /^\[Plugin Submission\]\s+.+\s+v[0-9\.]+.*$/;
            if (!titleRegex.test(title)) {
              await fail("Invalid issue title format. Must begin with `[Plugin Submission]` followed by the plugin name and version.");
              return;
            }

            const jsonMatch = body.match(/```json\s*([\s\S]*?)\s*```/);
            if (!jsonMatch) {
              await fail("Could not find JSON payload in the issue body. Please ensure you included a ` ```json ` block.");
              return;
            }

            let payload;
            try {
              payload = JSON.parse(jsonMatch[1]);
            } catch (e) {
              await fail("Invalid JSON payload. Please check for syntax errors.");
              return;
            }

            const { plugin_name, repository_url, commit_hash } = payload;
            
            if (!plugin_name || !repository_url || !commit_hash) {
              await fail("Missing required fields in payload. Ensure `plugin_name`, `repository_url`, and `commit_hash` are provided.");
              return;
            }

            const urlRegex = /^https?:\/\/(www\.)?github\.com\/[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+(\.git)?\/?$/;
            if (!urlRegex.test(repository_url)) {
              await fail(`Invalid repository URL: \`${repository_url}\`. Must be a valid GitHub repository URL.`);
              return;
            }

            const hashRegex = /^[a-fA-F0-9]{40}$/;
            if (!hashRegex.test(commit_hash)) {
              await fail(`Invalid commit hash: \`${commit_hash}\`. Must be a full 40-character SHA-1 hash.`);
              return;
            }

      - name: Checkout plugins-test registry
        uses: actions/checkout@v4
        with:
          path: plugins-test

      - name: Setup Node.js and TypeScript
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile TypeScript Script
        run: |
          cd plugins-test/scripts
          npm ci
          npx tsc scan-manager.ts --esModuleInterop --skipLibCheck || true

      - name: Phase 1 - Parse payload and Initial Check
        id: init
        env:
          INITIAL_COMMENT_ID: ${{ steps.ack.outputs.result }}
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            return await script.initialize({github, context, core});
        
      - name: Phase 2 - Environment Provisioning
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            await script.updatePhase({github, context}, '${{ steps.init.outputs.comment_id }}', 2);

      - name: Checkout Target Plugin Repository
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.init.outputs.repo_name }}
          ref: ${{ steps.init.outputs.commit_hash }}
          path: target-plugin

      - name: Isolate Source Directory
        if: success() && steps.init.outputs.should_proceed == 'true'
        run: |
          cd target-plugin
          find . -mindepth 1 -maxdepth 1 ! -name 'src' ! -name 'package.json' ! -name '.git' -exec rm -rf {} +

      - name: Phase 3 - CodeQL Initialization (Database Compile)
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            await script.updatePhase({github, context}, '${{ steps.init.outputs.comment_id }}', 3);

      - name: Initialize CodeQL
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          source-root: target-plugin
          config-file: ./plugins-test/.github/codeql/codeql-config.yml
          queries: ./plugins-test/.github/codeql/codeql_rules/combined-threats.qls

      - name: Phase 4 - SAST Analysis (Taint Tracking & Data Flow)
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            await script.updatePhase({github, context}, '${{ steps.init.outputs.comment_id }}', 4);

      - name: Perform CodeQL Analysis
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          output: codeql-results
          upload: false

      - name: Phase 5 - Report Generation
        if: always() && steps.init.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            await script.updatePhase({github, context}, '${{ steps.init.outputs.comment_id }}', 5);

      - name: Finalize Report
        if: always() && steps.init.outputs.should_proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const script = await import(`${process.env.GITHUB_WORKSPACE}/plugins-test/scripts/scan-manager.js`);
            await script.generateFinalReport({github, context}, '${{ steps.init.outputs.comment_id }}', 'codeql-results/javascript.sarif', '${{ steps.init.outputs.repository_url }}', '${{ steps.init.outputs.commit_hash }}');

      - name: Handle Workflow Failure
        if: failure() && steps.ack.outputs.result && steps.init.outputs.handled_failure != 'true' && steps.preflight.outputs.handled_failure != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = '${{ steps.ack.outputs.result }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: parseInt(commentId),
              body: `❌ **Security Scan Failed**\n\nThe workflow encountered a critical system error before completion.\n\n[View Workflow Logs for Details](${runUrl})`
            });

