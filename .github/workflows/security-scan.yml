name: Plugin Security Scan

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  scan:
    if: contains(github.event.issue.title, '[Plugin Submission]')
    runs-on: ubuntu-latest
    env:
      SCAN_MANAGER_PATH: ${{ github.workspace }}/plugins-test/scripts/code-scan/scanManager.js
    steps:
      - name: Checkout plugins-test registry
        uses: actions/checkout@v7
        with:
          path: plugins-test

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins-test/scripts/package-lock.json

      - name: Install and build scan scripts
        working-directory: plugins-test/scripts
        run: |
          npm ci
          npm run build

      - name: Acknowledge scan initialization
        id: ack
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.acknowledgeScanInitialization({github, context, core});

      - name: Pre-flight metadata validation
        id: preflight
        env:
          ACK_COMMENT_ID: ${{ steps.ack.outputs.result }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.preflightMetadataValidation({github, context, core});

      - name: Phase 1 - Parse payload and initial check
        id: init
        env:
          INITIAL_COMMENT_ID: ${{ steps.ack.outputs.result }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.initialize({github, context, core});

      - name: Phase 2 - Environment provisioning
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 2);

      - name: Checkout target plugin repository
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.init.outputs.repo_name }}
          ref: ${{ steps.init.outputs.commit_hash }}
          path: target-plugin

      - name: Validate target repository source
        id: sourcecheck
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            return await scan.validateTargetRepository({github, context, core}, process.env.INIT_COMMENT_ID, 'target-plugin');

      - name: Phase 3 - CodeQL initialization
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 3);

      - name: Initialize CodeQL
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          source-root: target-plugin
          config-file: ./plugins-test/.github/codeql/codeql-config.yml
          queries: ./plugins-test/.github/codeql/codeql_rules/combined-threats.qls

      - name: Phase 4 - SAST analysis
        if: success() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 4);

      - name: Perform CodeQL analysis
        if: success() && steps.init.outputs.should_proceed == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript
          output: codeql-results
          upload: false

      - name: Phase 5 - Report generation
        if: always() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.updatePhase({github, context}, process.env.INIT_COMMENT_ID, 5);

      - name: Finalize report
        if: always() && steps.init.outputs.should_proceed == 'true'
        env:
          INIT_COMMENT_ID: ${{ steps.init.outputs.comment_id }}
          INIT_REPO_URL: ${{ steps.init.outputs.repository_url }}
          INIT_COMMIT_HASH: ${{ steps.init.outputs.commit_hash }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.generateFinalReport(
              {github, context},
              process.env.INIT_COMMENT_ID,
              'codeql-results/javascript.sarif',
              process.env.INIT_REPO_URL,
              process.env.INIT_COMMIT_HASH
            );

      - name: Handle workflow failure
        if: failure() && steps.ack.outputs.result && steps.init.outputs.should_proceed != 'true' && steps.init.outputs.handled_failure != 'true' && steps.preflight.outputs.handled_failure != 'true' && steps.sourcecheck.outputs.handled_failure != 'true'
        env:
          ACK_COMMENT_ID: ${{ steps.ack.outputs.result }}
        uses: actions/github-script@v9
        with:
          script: |
            const scan = require(process.env.SCAN_MANAGER_PATH);
            await scan.handleWorkflowFailure({github, context}, process.env.ACK_COMMENT_ID);
